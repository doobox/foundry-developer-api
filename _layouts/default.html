<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
{% if page.description %}<meta name="description" content="{{ page.description | escape }}">{% endif %}
<title>{{ page.title | escape }}</title>
<link rel="stylesheet" href="{{ '/styles.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script src="{{ '/app.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</head>
<body data-base="{{ '/' | relative_url }}">
{% if page.url contains '/guide' %}{% assign docs_nav = site.data.guide_navigation %}{% else %}{% assign docs_nav = site.data.navigation %}{% endif %}
<script id="docs-navigation" type="application/json">{{ docs_nav | jsonify | replace: '</', '<\/' }}</script>
<a class="skip-link" href="#main-content">Skip to content</a>
<div class="shell">
<nav data-doc-nav aria-label="Documentation">
<noscript>
<a class="brand" href="{{ '/' | relative_url }}">{% if page.url contains '/guide' %}Foundry User Guide{% else %}Foundry Developer API{% endif %}</a>
<p>Browse the documentation. Enable JavaScript for search and expandable navigation.</p>
{% include navigation-map.html compact=true %}
</noscript>
</nav>
<main id="main-content" tabindex="-1">
{{ content }}
</main>
</div>
</body>
</html>
