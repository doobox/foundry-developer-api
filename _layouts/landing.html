<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
{% if page.description %}<meta name="description" content="{{ page.description | escape }}">{% endif %}
<title>{{ page.title | escape }}</title>
<link rel="stylesheet" href="{{ '/styles.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body data-base="{{ '/' | relative_url }}">
<a class="skip-link" href="#main-content">Skip to content</a>
<main id="main-content" tabindex="-1" class="landing">
{{ content }}
</main>
</body>
</html>
